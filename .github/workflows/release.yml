# Pushing a version tag (v1.3.0) builds BuffSentinel-v1.3.0.zip and uploads it to
# CurseForge and to a GitHub release.
#
# Needs, in the repo's Settings > Secrets and variables > Actions:
#   secret   CF_API_KEY       - a CurseForge API token (authors.curseforge.com > API tokens)
#   variable CF_GAME_VERSION  - optional: the CurseForge game version(s) to upload for, e.g. 1.15.8.
#                               Without it, the versions are read from the TOC's ## Interface line.
# The CurseForge project is the ## X-Curse-Project-ID line in BuffSentinel.toc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # (to create the GitHub release)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # (the packager reads the tags)

      - uses: BigWigsMods/packager@v2
        with:
          args: ${{ vars.CF_GAME_VERSION && format('-g {0}', vars.CF_GAME_VERSION) || '' }}
